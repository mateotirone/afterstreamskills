<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass and light backgrounds</title>
<link rel="stylesheet" href="glass.css">
<style>
  /* Open this file in a browser. ?theme=light|dark forces a theme. ?t=9 freezes time (what bake.mjs uses). */
  html,body{margin:0;background:var(--bg-base);color:var(--gl-text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:32px 16px 64px}
  h1{margin:0 0 6px;font-size:28px}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .bar button{font:600 13px system-ui;padding:7px 12px;border-radius:999px;border:1px solid var(--gl-glass-line);background:var(--gl-glass);color:var(--gl-text);cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
  .gp-stage{aspect-ratio:16/10;border-radius:16px}
  .gl-card{position:absolute;left:14px;bottom:14px;padding:10px 13px;font-size:14px}
  .gl-card b{display:block;font-size:16px}
  .photo-thumb{position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);width:28%;aspect-ratio:9/16;border-radius:12px;background:var(--gl-photo) center/cover;box-shadow:0 14px 30px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><div><h1>Glass and light backgrounds</h1><div>Hover the lens. Click the water.</div></div>
    <div><button data-t="light">Light</button> <button data-t="dark">Dark</button> <button data-t="system">Match system</button></div></div>
  <div class="grid">
    <div class="gp-stage"><canvas class="gp-bg" data-fx="thermal"></canvas><div class="gl-card"><b>Thermal gradient</b>Heat field, cool to hot</div></div>
    <div class="gp-stage gl-photo" style="--gl-photo:url('https://picsum.photos/id/1011/540/960')"><div class="photo-thumb"></div><div class="gl-card"><b>Blurred photo</b>Pure CSS</div></div>
    <div class="gp-stage"><canvas class="gp-bg" data-fx="fluted"></canvas><div class="gl-card"><b>Fluted glass</b>Reeded glass over soft shapes</div></div>
    <div class="gp-stage"><canvas class="gp-bg gl-interactive" data-fx="lens" data-interactive></canvas><div class="gl-card"><b>Lens distortion</b>Follows the pointer</div></div>
    <div class="gp-stage"><canvas class="gp-bg" data-fx="iridescent"></canvas><div class="gl-card"><b>Iridescent shapes</b>Thin-film color</div></div>
    <div class="gp-stage"><canvas class="gp-bg gl-interactive" data-fx="ripples" data-interactive></canvas><div class="gl-card"><b>Water ripples</b>Click to drop</div></div>
  </div>
</div>
<script src="glass.js"></script>
<script>
  const qs = new URLSearchParams(location.search), root = document.documentElement;
  const setTheme = t => t === 'system' ? root.removeAttribute('data-theme') : root.setAttribute('data-theme', t);
  if (qs.get('theme')) setTheme(qs.get('theme'));
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => setTheme(b.dataset.t));
  const fixedTime = qs.get('t') ? parseFloat(qs.get('t')) : null;
  document.querySelectorAll('canvas[data-fx]').forEach(c =>
    AfterstreamGlass.mount(c, c.dataset.fx, { interactive: c.hasAttribute('data-interactive'), pointerTarget: c.parentElement, fixedTime }));
</script>
</body>
</html>
